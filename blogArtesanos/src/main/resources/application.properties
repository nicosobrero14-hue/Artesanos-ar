spring.application.name=blogArtesanos

# Database — todos los datos sensibles van por env vars.
# Para prod la URL completa también va por env (ej. RDS, Railway, etc.)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/blogartesanos?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dev: update. Prod: validate (los cambios de schema se hacen con migraciones)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Mostrar SQL solo en dev. Apagar en prod (genera ruido y filtra info)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

cloudinary.cloud-name=${CL_NAME}
cloudinary.api-key=${CL_API_KEY}
cloudinary.api-secret=${CL_SECRET}

spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail-from=${MAIL_FROM:noreply@artesanos-ar.com.ar}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Lista de orígenes permitidos por CORS (separados por coma).
# Dev: http://localhost:5173
# Prod: tu dominio real, ej. https://artesanos.ar,https://www.artesanos.ar
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}

# Actuator: solo exponemos /health y /info públicos (status del servicio).
# El resto cerrado. Si querés métricas (Prometheus, etc.) extendé este patrón.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Email del admin — al arrancar Spring Boot, AdminBootstrap garantiza
# que este usuario exista con rol ADMIN, plan PREMIUM vitalicio y verificado.
# Si todavía no existe, lo crea con app.admin-password.
app.admin-email=${ADMIN_EMAIL}
app.admin-password=${ADMIN_PASSWORD}
app.admin-nombre=${ADMIN_NAME}

server.port=${PORT:8080}

spring.jpa.open-in-view=false

# Subida de archivos: videos pueden ser grandes (max 50MB por request).
# Cloudinary igual recorta a 30s, pero el archivo crudo puede pesar más.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
